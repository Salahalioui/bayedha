<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="45%" stop-color="#184332"/>
      <stop offset="80%" stop-color="#2a5a44"/>
      <stop offset="100%" stop-color="#3d7358"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#133627"/>
      <stop offset="100%" stop-color="#1b4d38"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3d2f"/>
      <stop offset="100%" stop-color="#0e231b"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="450" fill="url(#skyGrad)"/>

  <!-- Morning Sun / Spiritual Glow -->
  <circle cx="950" cy="180" r="130" fill="url(#sunGrad)"/>
  <circle cx="950" cy="180" r="180" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Islamic Geometric Pattern Accent (Faded in Sky) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5" fill="none">
    <polygon points="200,60 230,90 200,120 170,90"/>
    <polygon points="200,60 230,90 200,120 170,90" transform="rotate(45 200 90)"/>
    <polygon points="400,80 430,110 400,140 370,110"/>
    <polygon points="400,80 430,110 400,140 370,110" transform="rotate(45 400 110)"/>
    <polygon points="650,50 680,80 650,110 620,80"/>
    <polygon points="650,50 680,80 650,110 620,80" transform="rotate(45 650 80)"/>
  </g>

  <!-- Distant Steppe Mountains (El Bayadh Highlands) -->
  <path d="M0,320 Q250,220 500,280 T1000,250 Q1100,270 1200,290 L1200,450 L0,450 Z" fill="url(#mountainFar)" opacity="0.6"/>
  <path d="M0,350 Q300,280 600,320 T1200,300 L1200,450 L0,450 Z" fill="url(#groundGrad)"/>

  <!-- Traditional Algerian Minaret (Right Side) -->
  <g transform="translate(860, 90)">
    <!-- Tower Body -->
    <rect x="50" y="70" width="80" height="230" fill="#132c21" rx="4"/>
    <!-- Minaret Arches / Windows -->
    <rect x="75" y="110" width="30" height="50" rx="15" fill="#fef08a" opacity="0.75"/>
    <rect x="80" y="180" width="20" height="35" rx="10" fill="#fef08a" opacity="0.6"/>
    <!-- Balcony / Muezzin Gallery -->
    <rect x="40" y="60" width="100" height="15" fill="#1a3f30" rx="3"/>
    <line x1="45" y1="60" x2="135" y2="60" stroke="#fbbf24" stroke-width="2"/>
    <!-- Upper Lantern -->
    <rect x="65" y="25" width="50" height="35" fill="#16382a" rx="3"/>
    <rect x="80" y="32" width="20" height="22" rx="10" fill="#fef08a" opacity="0.8"/>
    <!-- Dome & Crescent (Jamour) -->
    <path d="M65,25 Q90,-10 115,25 Z" fill="url(#goldAccent)"/>
    <line x1="90" y1="-10" x2="90" y2="-35" stroke="#fbbf24" stroke-width="3"/>
    <!-- Crescent -->
    <path d="M90,-42 A8,8 0 1,1 90,-26 A6,6 0 1,0 90,-42 Z" fill="#fbbf24"/>
  </g>

  <!-- Mosque Dome Silhouette -->
  <path d="M720,350 C720,270 860,270 860,350 Z" fill="#153326"/>
  <line x1="790" y1="270" x2="790" y2="250" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="790" cy="246" r="4" fill="#fbbf24"/>

  <!-- Steppe Flora & Trees (Pines, Date Palms & Shrubs) -->
  <!-- Pine Trees (Left & Center) -->
  <g fill="#1b4935">
    <!-- Tree 1 -->
    <polygon points="180,360 210,310 240,360"/>
    <polygon points="190,320 210,280 230,320"/>
    <polygon points="195,290 210,260 225,290"/>
    <rect x="206" y="360" width="8" height="25" fill="#0f241a"/>

    <!-- Tree 2 -->
    <polygon points="250,370 275,325 300,370"/>
    <polygon points="258,335 275,295 292,335"/>
    <polygon points="265,305 275,275 285,305"/>
    <rect x="271" y="370" width="8" height="20" fill="#0f241a"/>

    <!-- Tree 3 -->
    <polygon points="620,380 645,335 670,380"/>
    <polygon points="628,345 645,310 662,345"/>
    <rect x="641" y="380" width="7" height="15" fill="#0f241a"/>
  </g>

  <!-- Volunteers & Community Silhouettes (Engaged in Touiza) -->
  <g fill="#2e7d32" opacity="0.95">
    <!-- Volunteer 1: Planting a Sprout -->
    <circle cx="370" cy="340" r="8" fill="#a7f3d0"/>
    <path d="M362,348 Q370,365 375,385 L355,390 Q358,365 362,348 Z" fill="#22543d"/>
    <path d="M375,365 L395,380 L398,375 L380,360 Z" fill="#2e7d32"/>
    <!-- Small Plant Sprout with Glow -->
    <path d="M400,380 Q405,365 412,368 Q405,378 400,380 Z" fill="#4ade80"/>
    <path d="M400,380 Q395,368 388,372 Q396,378 400,380 Z" fill="#86efac"/>

    <!-- Volunteer 2: Teaming Up / Carrying Tools -->
    <circle cx="450" cy="330" r="8" fill="#a7f3d0"/>
    <path d="M442,338 L458,338 L455,385 L445,385 Z" fill="#22543d"/>
    <line x1="435" y1="345" x2="470" y2="390" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

    <!-- Volunteer 3: Youth Watering -->
    <circle cx="530" cy="335" r="8" fill="#a7f3d0"/>
    <path d="M522,343 L538,343 L535,385 L525,385 Z" fill="#22543d"/>
    <path d="M538,350 L555,360 L550,370 Z" fill="#2e7d32"/>
  </g>

  <!-- Foreground Atmospheric Shading Ribbon -->
  <rect y="400" width="1200" height="50" fill="#091712" opacity="0.7"/>

  <!-- Inspiring Calligraphy Banner Overlay (Left Side) -->
  <g transform="translate(60, 80)">
    <!-- Glassmorphic Banner Card -->
    <rect width="480" height="150" rx="16" fill="#0b1d16" fill-opacity="0.75" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="30" y="48" font-family="'Readex Pro', 'Amiri', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">تويزة المساجد ولجان الأحياء</text>
    <text x="30" y="80" font-family="'Readex Pro', 'Amiri', system-ui, sans-serif" font-size="15" font-weight="500" fill="#86efac">« إِمَاطَةُ الأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ »</text>
    <text x="30" y="112" font-family="'Readex Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#cbd5e1">مبادرة العمل التشاركي لترسيخ النظافة والغرس في مدينة البيض</text>
  </g>
</svg>
