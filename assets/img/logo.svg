<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bayedhaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12241e"/>
      <stop offset="50%" stop-color="#1b382f"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bayedhaGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#2e7d32" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Steppe Landscape & Sun Arc -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Central Stylized Sprout / Pin Motif -->
  <g filter="url(#dropShadow)" transform="translate(256, 240)">
    <!-- Location Pin / Seed Base -->
    <path d="M0 -110 C60 -110 105 -65 105 -5 C105 55 20 115 0 150 C-20 115 -105 55 -105 -5 C-105 -65 -60 -110 0 -110 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Inner Green Leaf (Left) -->
    <path d="M0 80 C-45 30 -70 -20 -50 -60 C-30 -100 0 -50 0 80 Z" fill="url(#leafGrad)"/>
    
    <!-- Inner Green Leaf (Right) -->
    <path d="M0 80 C45 30 70 -20 50 -60 C30 -100 0 -50 0 80 Z" fill="#2e7d32"/>
    
    <!-- Central Seed / Water Drop -->
    <path d="M0 -20 C15 -20 25 -5 25 15 C25 35 0 60 0 60 C0 60 -25 35 -25 15 C-25 -5 -15 -20 0 -20 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: بيّضها -->
  <text x="256" y="445" font-family="'Readex Pro', 'Amiri', 'Tajawal', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">بيّضها</text>
  <text x="256" y="475" font-family="'Readex Pro', system-ui, sans-serif" font-size="16" font-weight="600" fill="#86efac" text-anchor="middle" letter-spacing="4">EL BAYADH</text>
</svg>
