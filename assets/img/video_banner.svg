<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f4431"/>
      <stop offset="50%" stop-color="#082b1e"/>
      <stop offset="100%" stop-color="#03140e"/>
    </radialGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Button Glow Filter -->
    <filter id="btnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    .title-ar { font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; font-size: 76px; font-weight: 800; fill: #ffffff; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .title-highlight { fill: #34d399; font-weight: 900; }
    .subtitle-ar { font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; font-size: 32px; font-weight: 600; fill: #f3f4f6; }
    .badge-text { font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; font-size: 20px; font-weight: 700; fill: #6ee7b7; letter-spacing: 0.5px; }
    .btn-text { font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; font-size: 26px; font-weight: 800; fill: #064e3b; }
    .meta-text { font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; font-size: 18px; font-weight: 500; fill: #9ca3af; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Top Header Bar -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="1200" height="54" rx="27" fill="#041f15" fill-opacity="0.7" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="1160" y="34" text-anchor="end" fill="#e5e7eb" font-family="'Readex Pro', sans-serif" font-size="18" font-weight="700">الجمهورية الجزائرية الديمقراطية الشعبية | ولاية البيض</text>
    <rect x="20" y="10" width="140" height="34" rx="17" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="33" text-anchor="middle" class="badge-text">🌿 التويزة الرقمية DZ</text>
  </g>

  <!-- Center Presentation Card -->
  <g transform="translate(640, 260)">
    <!-- Pill Badge -->
    <rect x="-180" y="-80" width="360" height="42" rx="21" fill="#064e3b" fill-opacity="0.8" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="-53" text-anchor="middle" class="badge-text">🌱 مبادرة التويزة الرقمية للبيئة الحضرية</text>

    <!-- Main Title -->
    <text x="0" y="30" text-anchor="middle" class="title-ar">
      بَيّضْهَا <tspan class="title-highlight">| Bayedha</tspan>
    </text>

    <!-- Catchphrase -->
    <text x="0" y="90" text-anchor="middle" class="subtitle-ar">
      مِنْ أَجْلِ مَدِينَةٍ أَنْقَى وَمُحِيطٍ حَضَرِيٍّ رَاقٍ.. نُقَدِّمُ مَنَصَّةَ «بَيَّضْهَا»
    </text>
    <text x="0" y="130" text-anchor="middle" class="subtitle-ar" fill="#a7f3d0" font-size="24">
      المبادرة التشاركية الرقمية لولاية البيض 🇩🇿
    </text>
  </g>

  <!-- Giant Glowing Play Button -->
  <g transform="translate(640, 520)">
    <!-- Outer Glow Pulse Ring -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6,6"/>
    <circle cx="0" cy="0" r="56" fill="#10b981" fill-opacity="0.25" filter="url(#btnGlow)"/>
    <!-- Button Body -->
    <circle cx="0" cy="0" r="48" fill="#34d399" stroke="#ffffff" stroke-width="3" filter="url(#btnGlow)"/>
    <!-- Triangle Icon -->
    <polygon points="-12,-18 20,0 -12,18" fill="#064e3b"/>
  </g>

  <!-- Bottom CTA Text -->
  <g transform="translate(640, 625)">
    <text x="0" y="0" text-anchor="middle" class="btn-text" fill="#6ee7b7" font-size="22">
      ▶ انقر لمشاهدة الفيديو التعريفي الشامل للمنصة
    </text>
    <text x="0" y="30" text-anchor="middle" class="meta-text">
      ⏱️ المدة: 37 ثانية • 🎬 دقة فائقة 4K Ultra HD • 🎙️ تعليق صوتي احترافي • 🌿 تجربة تفاعلية متكاملة
    </text>
  </g>
</svg>